version: 2
# All update PRs target the default branch (`main`). There is no `dev`
# integration branch any more — see "Branch flow" in CLAUDE.md.
#
# Node.js stays on the 24 LTS line until the coordinated Node 26 upgrade in
# issue #47. Major bumps of the runtime image and `@types/node` are ignored
# here so Dependabot doesn't reopen the deferred PRs; delete both `ignore`
# blocks as part of that upgrade.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/London"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/ops"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/London"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      container-images-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/ops"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "Europe/London"
    groups:
      compose-images-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
